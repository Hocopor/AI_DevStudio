events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Скрыть версию nginx
    server_tokens off;

    # Запрет индексирования поисковиками
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    # Безопасность
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting — защита от брутфорса на логин
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # Общий rate limit
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # robots.txt — отдаём до любых проверок
        location = /robots.txt {
            root /usr/share/nginx/html;
            access_log off;
        }

        # Заблокировать типичных ботов по User-Agent
        if ($http_user_agent ~* (bot|crawl|spider|slurp|yahoo|baidu|bing|google|yandex)) {
            return 403;
        }

        # --- WebSocket ---
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # --- Логин (rate limit строгий) ---
        location = /api/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- API ---
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # --- Frontend (Next.js) ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
